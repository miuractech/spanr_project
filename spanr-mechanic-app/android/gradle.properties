org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=256m -XX:-UseParallelGC
kotlin.incremental=true
kotlin.compiler.execution.strategy=out-of-process
org.gradle.workers.max=2
android.useAndroidX=true
